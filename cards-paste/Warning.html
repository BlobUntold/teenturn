<div class="card warning-card">
 <h2>Warning</h2>
 <p>This card can show a warning or alert.</p>
 <div class="status-box" id="warningX">Warning: none</div>
</div>

<script>
 function updateWarningX() {
 fetch('/warningX')
.then(response => response.text())
.then(data => {
 document.getElementById('warningX').textContent = 'Warning: ' + data;
 })
.catch(error => {
 document.getElementById('warningX').textContent = 'Warning: unavailable';
 });
 }

 setInterval(updateWarningX, 1500);
 updateWarningX();
</script>

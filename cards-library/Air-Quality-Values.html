<!--
Copy these cards into the <div class="dashboard"> area.
The main sketch automatically updates IDs co2Value, temperatureValue,
humidityValue, and airQualityValue.
-->

<div class="card blue-card">
  <h2>CO2 Level</h2>
  <p>Live carbon dioxide measurement from the SCD41.</p>
  <div class="status-box" id="co2Value">CO2: waiting...</div>
</div>

<div class="card light-card">
  <h2>Temperature</h2>
  <p>Live room temperature.</p>
  <div class="status-box" id="temperatureValue">Temperature: waiting...</div>
</div>

<div class="card light-card">
  <h2>Humidity</h2>
  <p>Live relative humidity.</p>
  <div class="status-box" id="humidityValue">Humidity: waiting...</div>
</div>

<div class="card green-card">
  <h2>Air Quality</h2>
  <p>Good, moderate, or high CO2.</p>
  <div class="status-box" id="airQualityValue">Air quality: waiting...</div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gallery Test</title>
 <style>
 body {
 background: #0b1020;
 color: white;
 font-family: Arial, sans-serif;
 padding: 20px;
 }

.dashboard {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 20px;
 max-width: 1000px;
 margin: 0 auto;
 }

.card {
 background: #2563eb;
 padding: 20px;
 border-radius: 16px;
 }

.light {
 background: white;
 color: black;
 }
 </style>
</head>
<body>
 <h1>Gallery Test</h1>

 <div class="dashboard">
 <div class="card">Blue card</div>
 <div class="card light">Light card</div>
 </div>
</body>
</html>
